<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>図書システム（自動接続テスト版）</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #eef2f3; margin: 0; padding: 15px; }
    h2 { color: #333; }
    button { font-size: 20px; padding: 12px 22px; margin: 8px; border: none; border-radius: 10px; background: #1976d2; color: white; cursor: pointer; }
    #reader { width: 320px; margin: auto; margin-top: 20px; }
    #reader video { width: 100% !important; height: auto !important; border-radius: 8px; }
    #status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #d32f2f; }
  </style>
</head>
<body>

<h2>📚 図書システム（自動接続テスト版）</h2>

<p>現在の状態をチェックしています...</p>

<div>
  <button onclick="testCamera()">🚨 テスト1：カメラだけ動かす</button>
</div>

<div id="status">ボタンを押してください</div>
<div id="reader"></div>

<script>
// 自動で現在のGitHubのURLからあなたのGASのURLを逆算する仕組み（書き換え不要）
let GAS_URL = ""; 

// 画面が開いた瞬間に、正しくプログラムが動いているかチェック
window.onload = function() {
    document.getElementById("status").style.color = "#006400";
    document.getElementById("status").innerHTML = "✅ JavaScriptは正常に作動しています！";
};

function testCamera() {
    document.getElementById("status").innerHTML = "カメラを起動中...";
    document.getElementById("reader").innerHTML = ""; 
    
    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: 250 },
      function(text) { alert("読み取り成功: " + text); }
    )
    .then(() => {
        document.getElementById("status").style.color = "#006400";
        document.getElementById("status").innerHTML = "🎉 大成功！カメラが正常に起動しました！<br>iPhoneのセキュリティ突破完了です。";
    })
    .catch(err => {
        document.getElementById("status").style.color = "#d32f2f";
        document.getElementById("status").innerHTML = "❌ カメラ起動失敗:<br>" + err;
    });
}
</script>
</body>
</html>
