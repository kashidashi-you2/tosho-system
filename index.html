<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学校図書貸出システム (ハイブリッド修正版)</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 15px; }
    h2 { color: #333; }
    button { font-size: 20px; padding: 12px 22px; margin: 8px; border: none; border-radius: 10px; background: #1976d2; color: white; cursor: pointer; }
    button:hover { opacity: 0.9; }
    #reader { width: 320px; margin: auto; margin-top: 20px; }
    #reader video { width: 100% !important; height: auto !important; border-radius: 8px; }
    #status { margin-top: 20px; font-size: 20px; font-weight: bold; color: #006400; white-space: pre-line; }
    .input-area { margin-top: 25px; background: white; padding: 15px; border-radius: 10px; max-width: 320px; margin: 20px auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    input { font-size: 18px; padding: 8px; width: 220px; margin: 6px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
    #loading { display: none; color: red; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>

<h2>📚 学校図書貸出システム</h2>

<div>
  <button onclick="setMode('lend')" style="background:#1976d2;">貸出モード</button>
  <button onclick="setMode('return')" style="background:#2e7d32;">返却モード</button>
</div>

<div id="status">モードを選択してください</div>
<div id="loading">通信中...</div>
<div id="reader"></div>

<div class="input-area">
  <h3>現在の入力状況</h3>
  <label>📕 本番号：</label><br>
  <input id="bookCode" placeholder="QR読み取り または 手入力" oninput="syncManualInput()"><br>
  <label>👤 利用者番号：</label><br>
  <input id="userCode" placeholder="QR読み取り または 手入力" oninput="syncManualInput()"><br><br>
  <button onclick="sendData()" style="background:#f57c00; font-size:18px; padding:8px 18px; width: 80%;">確定して送信</button>
</div>

<script>
// ==========================================================
// 👇【重要】ここにあなたのGASのURLを貼り付けてください（前後の " は消さないでください）
// ==========================================================
const GAS_URL = "https://script.google.com/macros/s/AKfycbwbkEEdKjgZ3RrrpSq7_uYq_oTmHZHPTx05JsvIFOzdFLUx8jlIFNBsBF5767Jb5Mf8/exec
";


let mode = "";
let step = 1; // 1: 本の読み取り待ち, 2: 利用者の読み取り待ち
let book = "";
let user = "";
let html5QrCode = null;
let isScanLocked = false; // 二重読み込み防止用のロック変数

function setMode(selected) {
    mode = selected;
    document.getElementById("bookCode").value = "";
    document.getElementById("userCode").value = "";
    book = ""; user = "";
    step = 1;
    isScanLocked = false;

    if (mode === "lend") {
        document.getElementById("status").style.color = "#006400";
        document.getElementById("status").innerHTML = "📕 【貸出】本のQRを読み取るか、手入力してください";
        startScanner();
    } else if (mode === "return") {
        document.getElementById("status").style.color = "#006400";
        document.getElementById("status").innerHTML = "📗 【返却】本のQRを読み取るか、手入力してください";
        startScanner();
    }
}

function startScanner() {
  if (html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => { initAndStart(); }).catch(() => { initAndStart(); });
  } else {
    initAndStart();
  }
}

function initAndStart() {
  document.getElementById("reader").innerHTML = ""; 
  html5QrCode = new Html5Qrcode("reader");
  html5QrCode.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
  )
  .catch(err => {
    console.log("カメラの起動をスキップしました（手入力は可能です）: " + err);
  });
}

// QRコードの読み取りに成功したときの処理
function onScanSuccess(decodedText) {
    // 【対策2】二重読み込み防止ロックがかかっていたら完全に無視する
    if (isScanLocked) return;

    if (mode === "lend") {
        if (step === 1) {
            // 1回目の読み取り（本ID）が成功したらロックをかける
            isScanLocked = true;
            book = decodedText;
            document.getElementById("bookCode").value = book;
            step = 2;
            document.getElementById("status").style.color = "#006400";
            document.getElementById("status").innerHTML = "👤 【貸出】利用者QRを読み取るか、手入力してください";
            
            // 1.5秒後にロックを解除（これで高速2連射されても利用者IDに化けなくなります）
            setTimeout(() => { isScanLocked = false; }, 1500);

        } else if (step === 2) {
            user = decodedText;
            document.getElementById("userCode").value = user;
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => { sendData(); }).catch(() => { sendData(); });
            } else {
                sendData();
            }
        }
    } else if (mode === "return") {
        book = decodedText;
        document.getElementById("bookCode").value = book;
        user = "";
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().then(() => { sendData(); }).catch(() => { sendData(); });
        } else {
            sendData();
        }
    }
}

// キーボードで直接手入力・削除されたときのリアルタイム同期処理
function syncManualInput() {
    book = document.getElementById("bookCode").value.trim();
    user = document.getElementById("userCode").value.trim();
    
    if (mode === "lend") {
        // 【対策1】もし本番号が空っぽに消されたら、強制的に本の読み取り待ち（ステップ1）に戻す
        if (book === "") {
            step = 1;
            document.getElementById("status").style.color = "#006400";
            document.getElementById("status").innerHTML = "📕 【貸出】本のQRを読み取るか、手入力してください";
        } 
        // 本番号が入っていて、利用者欄が空ならステップ2（利用者待ち）にする
        else if (book !== "" && user === "") {
            step = 2;
            document.getElementById("status").style.color = "#006400";
            document.getElementById("status").innerHTML = "👤 【貸出】利用者QRを読み取るか、手入力してください";
        }
    }
}

function sendData() {
    book = document.getElementById("bookCode").value.trim();
    user = document.getElementById("userCode").value.trim();

    if (!mode) { alert("最初にモード（貸出または返却）を選択してください。"); return; }
    if (book === "") { alert("本番号が入力されていません。"); return; }
    if (mode === "lend" && user === "") { alert("利用者番号が入力されていません。"); return; }

    document.getElementById("loading").style.display = "block";
    document.getElementById("status").style.color = "#000000";
    document.getElementById("status").innerHTML = "データを送信中...";

    if (html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => { executeFetch(); }).catch(() => { executeFetch(); });
    } else {
        executeFetch();
    }
}

function executeFetch() {
    fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ mode: mode, book: book, user: user })
    })
    .then(res => res.text())
    .then(message => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("status").innerHTML = message;

        document.getElementById("bookCode").value = "";
        document.getElementById("userCode").value = "";
        book = ""; user = ""; step = 1; 
        isScanLocked = false; // 送信完了後にロックをリセット

        if (message.includes("完了")) {
            document.getElementById("status").style.color = "#006400";
            document.getElementById("status").innerHTML += `\n\n🔄 続けて次の本を処理できます（${mode === 'lend' ? '貸出' : '返却'}）`;
        } else {
            document.getElementById("status").style.color = "#d32f2f";
            document.getElementById("status").innerHTML += `\n\n⚠️ エラーを確認して、もう一度やり直してください。`;
        }
        setTimeout(() => { startScanner(); }, 1800);
    })
    .catch(error => {
        document.getElementById("loading").style.display = "none";
        document.getElementById("status").style.color = "#d32f2f";
        alert("通信エラーが発生しました。\n詳細: " + error.message);
        isScanLocked = false;
        setTimeout(() => { startScanner(); }, 1800);
    });
}
</script>
</body>
</html>
